services:
  - type: web
    name: civicledger-governance-api
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: USE_IN_MEMORY_DB
        value: "false"
      - key: AUTO_SEED_DEMO
        value: "true"
      - key: ALLOW_VERCEL_PREVIEWS
        value: "true"
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
